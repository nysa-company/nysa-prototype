name: repository-baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: scripts/repo-check
      - run: scripts/secret-scan
      - run: scripts/artifact-check --base origin/main
      - run: |-
          scripts/verify
